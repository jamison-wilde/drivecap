[package]
name = "drivecap-cli"
version = "0.1.0"
edition = "2024"
authors = ["Jamison Wilde"]
description = "Drivecap — always-on-top disk-space warner for Windows"
license = "MIT"

[[bin]]
name = "drivecap"
path = "src/bin/drivecap.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
] }

[dependencies.windows-core]
version = "0.61"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Lint gate: deny warnings and clippy::all at build time. Pedantic is
# held at `allow` because `warnings = "deny"` in [lints.rust] captures
# clippy warnings too, which would promote every pedantic finding to
# a hard error.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
redundant_explicit_links = "deny"
